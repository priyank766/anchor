name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow publish workflow to call this as a reusable check
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't block CI on advisories, but surface them

      # Server MUST build first — CLI imports from @anchormem/server
      # and needs the .d.ts files to exist at compile time.
      - name: Build server
        run: npm run build
        working-directory: packages/server

      - name: Build CLI
        run: npm run build
        working-directory: packages/cli

      - name: Test server
        run: npx vitest run
        working-directory: packages/server

      - name: Test CLI
        run: npx vitest run
        working-directory: packages/cli
