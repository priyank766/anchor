name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Server MUST build first — CLI imports from @anchormem/server
      # and needs the .d.ts files to exist at compile time.
      - name: Build server
        run: npm run build
        working-directory: packages/server

      - name: Build CLI
        run: npm run build
        working-directory: packages/cli

      - name: Test (server)
        run: npx vitest run
        working-directory: packages/server

      - name: Test (cli)
        run: npx vitest run
        working-directory: packages/cli
